<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>❤️ Happy Birthday Tannu ❤️</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- =========================
PASSWORD SCREEN
========================= -->

<div id="password-screen">

<div class="bg-stars"></div>

<div class="glass-card">

<h1>❤️ A Special Surprise ❤️</h1>

<p class="subtitle">
Only For Tannu
</p>

<input
type="password"
id="password"
placeholder="Enter Secret Password">

<button id="unlockBtn">

🔓 Unlock My Surprise

</button>

<p id="error"></p>

</div>

</div>
<!-- =========================
LOADING SCREEN
========================= -->

<div id="loading-screen">

<div class="bg-stars"></div>

<div class="glass-card">

<h2>✨ Unlocking Your Surprise ✨</h2>

<p>Please wait...</p>

<div class="progress">

<div id="progress-bar"></div>

</div>

<p id="progress-text">0%</p>

</div>

</div>

<!-- =========================
WELCOME SCREEN
========================= -->

<div id="welcome-screen">

<div class="bg-stars"></div>

<div class="glass-card">

<h1>
❤️ Happy Birthday Tannu ❤️
</h1>

<p class="subtitle">

Every moment with you is special...

</p>

<button id="startBtn">

🎁 Open Your Surprise

</button>

</div>
</div>


<div id="letter-screen" style="display:none;">

    <div class="bg-stars"></div>

    <div class="letter-box">

        <div class="envelope">💌</div>

        <h1>For My Love ❤️</h1>

        <p id="letter-text"></p>

        <button id="nextLetter">
            ➜ Next Surprise
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
